<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6D00"/>
      <stop offset="50%" stop-color="#E65100"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAB40"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main circle -->
  <circle cx="160" cy="160" r="145" fill="url(#bg)" filter="url(#shadow)"/>
  
  <!-- Shine overlay -->
  <circle cx="160" cy="160" r="145" fill="url(#shine)"/>
  
  <!-- Outer ring -->
  <circle cx="160" cy="160" r="132" fill="none" stroke="#FFAB40" stroke-width="2.5" opacity="0.45"/>
  
  <!-- Inner decorative ring -->
  <circle cx="160" cy="160" r="118" fill="none" stroke="white" stroke-width="1" opacity="0.18"/>

  <!-- Hexagon shape -->
  <polygon points="160,72 212,102 212,162 160,192 108,162 108,102" fill="none" stroke="url(#icon)" stroke-width="4" opacity="0.95" filter="url(#glow)"/>
  
  <!-- Inner hexagon -->
  <polygon points="160,92 197,113 197,153 160,174 123,153 123,113" fill="none" stroke="white" stroke-width="2" opacity="0.5"/>

  <!-- Center forge/anvil inspired icon -->
  <path d="M130 140 L160 120 L190 140 L190 155 L160 175 L130 155 Z" fill="white" opacity="0.9"/>
  <rect x="148" y="155" width="24" height="18" rx="2" fill="white" opacity="0.7"/>

  <!-- Bottom text -->
  <text x="160" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="white" text-anchor="middle" letter-spacing="3">HEX</text>
  <text x="160" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#FFCC80" text-anchor="middle" letter-spacing="3">FORGE</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5A00;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#E04000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B32D00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.04" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.12" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  
  <!-- Subtle grid -->
  <g opacity="0.07">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="white" stroke-width="1"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="white" stroke-width="1"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="white" stroke-width="1"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="white" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="1"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="white" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="420" stroke="white" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="420" stroke="white" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="420" stroke="white" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="420" stroke="white" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="420" stroke="white" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="420" stroke="white" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="420" stroke="white" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="420" stroke="white" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="420" stroke="white" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="420" stroke="white" stroke-width="1"/>
    <line x1="1100" y1="0" x2="1100" y2="420" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Glow overlay -->
  <rect width="1200" height="420" fill="url(#glow)"/>
  
  <!-- Logo circle -->
  <circle cx="180" cy="210" r="78" fill="white" opacity="0.12" filter="url(#shadow)"/>
  <circle cx="180" cy="210" r="60" fill="white" opacity="0.95" filter="url(#shadow)"/>
  
  <!-- HEX text inside logo -->
  <text x="180" y="225" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#FF5A00" text-anchor="middle">HEX</text>
  
  <!-- Main title -->
  <text x="300" y="175" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="bold" fill="white" filter="url(#shadow)">HEX Forge</text>
  
  <!-- Subtitle -->
  <text x="300" y="230" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#FFE8D6">AI-Powered GitHub Profile Builder Platform</text>
  
  <!-- Tagline -->
  <text x="300" y="275" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FFD0B0">Profiles • READMEs • Portfolios • Badges — Free Forever</text>
  
  <!-- Bottom accent -->
  <rect x="0" y="400" width="1200" height="20" fill="#8C2200" opacity="0.7"/>
  
  <!-- Decorative dots -->
  <circle cx="1050" cy="110" r="5" fill="white" opacity="0.35"/>
  <circle cx="1090" cy="150" r="3" fill="white" opacity="0.25"/>
  <circle cx="1130" cy="90" r="4" fill="white" opacity="0.3"/>
  <circle cx="1160" cy="180" r="3" fill="white" opacity="0.28"/>
  <circle cx="1020" cy="300" r="4" fill="white" opacity="0.25"/>
  <circle cx="1100" cy="320" r="3" fill="white" opacity="0.22"/>
</svg>